  <body class="bg-[#FAF9F5] text-[#14231A] antialiased selection:bg-[#1B7F3B]/15 selection:text-[#124E25]">
    <div id="root"></div>
    <script>
      window.__krishiDeferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__krishiDeferredInstallPrompt = event;
        window.dispatchEvent(new CustomEvent('krishi:install-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__krishiDeferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('krishi:app-installed'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
